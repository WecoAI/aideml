version: 1.1
kind: component
name: openrlhf-smoke-axia
description: >
  GPU smoke test for the AIDE OpenRLHF stack on axia/default.
  Checks CUDA, installs OpenRLHF+vLLM, starts Ray on 127.0.0.1 (not 0.0.0.0),
  runs a tiny SFT job and a minimal single-GPU GRPO job with the verifier reward.

queue: axia/default

inputs:
  - name: mode
    description: "gpu | venv | check | sft | grpo | all"
    type: str
    isOptional: true
    value: gpu

  - name: smoke_model
    description: Small HF model for the smoke run (keeps download/time reasonable).
    type: str
    isOptional: true
    value: Qwen/Qwen2.5-0.5B-Instruct

  - name: num_gpus
    description: GPUs to request and pass to Ray (--num-gpus).
    type: int
    isOptional: true
    value: 1

cache:
  disable: true

termination:
  maxRetries: 0

run:
  kind: job
  connections:
      - local-scratch

  # NOTE: do NOT add a /dev/shm volume here — the Polyaxon agent on axia
  # already injects one, and a duplicate mountPath makes the k8s API reject
  # the job (422 FieldValueDuplicate).

  container:
    # nvidia/cuda:*-base images have no python at all -> "python3: command not found".
    # Default is the NVIDIA PyTorch image OpenRLHF recommends; override with the
    # prebaked image (docker/openrlhf/Dockerfile) via -P image=... to skip installs.
    image: "guilhermedrud/aide-openrlhf:0.1"

    workingDir: "{{ globals.artifacts_path }}/{{ globals.uuid }}/uploads"

    resources:
      requests:
        cpu: "8"
        memory: "32Gi"
      limits:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "1"

    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: MODE
        value: "{{ mode }}"
      - name: SMOKE_MODEL
        value: "{{ smoke_model }}"
      - name: NUM_GPUS
        value: "{{ num_gpus }}"
      - name: OUTPUT_DIR
        value: "{{ globals.run_outputs_path }}/openrlhf_smoke"
      - name: HF_HOME
        value: "{{ globals.run_outputs_path }}/hf_cache"
      - name: RAY_IP
        value: "127.0.0.1"
      - name: INSTALL_OPENRLHF
        value: "1"
      - name: VENV_DIR
        value: "/tmp/aide-openrlhf-venv"
      # Set HF_TOKEN on the Polyaxon project for model downloads.

    # Invoke via `bash script.sh` (not `./script.sh`): the upload does not
    # preserve the exec bit, so direct execution fails with Permission denied.
    # Don't `pip install -r requirements.txt` here either — its unpinned
    # torch/numpy pins would clobber the prebaked vllm/flash-attn stack.
    command:
      - bash
      - scripts/openrlhf/smoke_test.sh
